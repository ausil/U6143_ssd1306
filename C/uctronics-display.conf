# SSD1306 OLED Display Configuration File
#
# This file configures the display settings for the UCTRONICS SSD1306 display
# Lines starting with '#' or ';' are comments
# Format: key = value
#
# Default location: /etc/uctronics-display.conf
# Alternative: display.conf (in same directory as executable)
# Override with: ./display -c /path/to/config.conf

[Display Settings]

# I2C device path
# Common values: /dev/i2c-1 (older Raspberry Pi), /dev/i2c-3 (Rock 3C)
# Check available devices with: ls /dev/i2c-*
i2c_device = /dev/i2c-3

# Temperature display type
# Values: celsius, fahrenheit (or 0, 1)
temperature_type = fahrenheit

# Network interface name
# Specify the actual network interface to query for IP address
# Common values: end0, eth0, enp0s3 (Ethernet), wlan0 (WiFi)
# Check available interfaces with: ip addr show
network_interface = end0

# IP display switch
# Values: open, close (or 0, 1)
# open = display IP address from network_interface
# close = display short hostname (fallback to custom_display if hostname unavailable)
ip_switch = open

# Custom display text
# Fallback text when ip_switch is 'close' and hostname cannot be retrieved
# Maximum 31 characters
custom_display = UCTRONICS
